// docs/proto/worker.proto — сгенерированный код -> common/api/protogen
syntax = "proto3";

package worker;

option go_package = "common/api/protogen";

// Реализует воркер. Вызывает control-plane (после того как решил, кому назначить задачу).
service WorkerService {
  rpc Dispatch(DispatchRequest) returns (DispatchResponse);
  rpc CancelTasks(CancelTasksRequest) returns (CancelTasksResponse); // best-effort остановка исполнения, батчем на воркера
}

message DispatchRequest {
  string workflow_id = 1;
  string task_id = 2;
  string type = 3;              // "shell" | "http"
  map<string, string> payload = 4;
  int64 timeout_seconds = 5;
}

message DispatchResponse {
  bool accepted = 1;   // воркер подтвердил приём задачи (Capacity позволяет запустить)
  string reason = 2;   // заполнено, если accepted == false ("worker busy" и т.п.)
}

message CancelTasksRequest {
  repeated string task_ids = 1;
}
message CancelTasksResponse {
  map<string, bool> cancelled = 1; // task_id -> false, если воркер уже не исполняет эту задачу
                                    // (завершилась/никогда не была здесь) — это НЕ ошибка, а нормальный
                                    // исход гонки с естественным завершением задачи
}
